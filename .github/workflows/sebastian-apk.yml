name: Build Sebastian Wake APK

on:
  push:
    branches: [sebastian-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0'

      - name: Clone GPTWake v1.1.0
        shell: bash
        run: |
          git clone --depth 1 --branch v1.1.0 https://github.com/suddenBook/GPTWake.git GPTWake

      - name: RED - add Ey Sebas test and verify it fails before implementation
        shell: bash
        run: |
          python3 sebastian_patch.py tests
          cd GPTWake
          set +e
          ./gradlew :app:testDebugUnitTest --tests com.desmond.gptwake.WakeWordTokenizerTest.spanishSebasUsesTunedPhonemeVariants > ../red-test.log 2>&1
          status=$?
          set -e
          cat ../red-test.log
          if [ "$status" -eq 0 ]; then
            echo 'ERROR: RED test unexpectedly passed before implementation.' >&2
            exit 1
          fi
          echo 'RED confirmed: test fails before Sebastian implementation.'

      - name: GREEN - apply Sebastian implementation
        shell: bash
        run: |
          python3 sebastian_patch.py production

      - name: Run unit tests
        shell: bash
        run: |
          cd GPTWake
          ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: |
          cd GPTWake
          ./gradlew :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Sebastian-Wake-v0.1.apk
          sha256sum ../Sebastian-Wake-v0.1.apk | tee ../Sebastian-Wake-v0.1.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sebastian-Wake-v0.1
          path: |
            Sebastian-Wake-v0.1.apk
            Sebastian-Wake-v0.1.sha256
          if-no-files-found: error
