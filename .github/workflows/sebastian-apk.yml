name: Build Sebastian Wake APK

on:
  push:
    branches: [sebastian-apk-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install current Android command-line tools
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          tmp=$(mktemp -d)
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -o "$tmp/tools.zip"
          unzip -q "$tmp/tools.zip" -d "$tmp/unpacked"
          sudo rm -rf "$ANDROID_HOME/cmdline-tools/16.0"
          sudo mkdir -p "$ANDROID_HOME/cmdline-tools/16.0"
          sudo cp -R "$tmp/unpacked/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/16.0/"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --version

      - name: Install Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'

      - name: Clone GPTWake v1.1.0
        shell: bash
        run: |
          git clone --depth 1 --branch v1.1.0 https://github.com/suddenBook/GPTWake.git GPTWake
          test "$(git -C GPTWake rev-parse HEAD)" = 2e31652be39b1751a6a75eac3027716b7d5286b1

      - name: RED - add Ey Sebas test and verify it fails before implementation
        shell: bash
        run: |
          python3 sebastian_patch.py tests
          cd GPTWake
          set +e
          ./gradlew :app:testDebugUnitTest --tests com.desmond.gptwake.WakeWordTokenizerTest.spanishSebasUsesTunedPhonemeVariants --info > ../red-test.log 2>&1
          status=$?
          set -e
          cat ../red-test.log
          xml='app/build/test-results/testDebugUnitTest/TEST-com.desmond.gptwake.WakeWordTokenizerTest.xml'
          if [ "$status" -eq 0 ]; then
            echo 'ERROR: RED test unexpectedly passed before implementation.' >&2
            exit 1
          fi
          if [ ! -f "$xml" ] || ! grep -q 'spanishSebasUsesTunedPhonemeVariants' "$xml" || ! grep -Eq 'failures="[1-9]' "$xml"; then
            echo 'ERROR: RED phase failed for an infrastructure reason, not the intended test.' >&2
            exit 1
          fi
          echo 'RED confirmed: Ey Sebas test fails because the feature is missing.'

      - name: GREEN - apply Sebastian implementation
        shell: bash
        run: |
          python3 sebastian_patch.py production
          python3 spanish_patch.py

      - name: Prepare and test offline Spanish model
        shell: bash
        run: |
          curl -fL --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip -o vosk-es.zip
          echo '09b239888f633ef2f0b4e09736e3d9936acfd810bc65d53fad45261762c6511f  vosk-es.zip' | sha256sum -c -
          unzip -q vosk-es.zip
          cp -R vosk-model-small-es-0.42 GPTWake/app/src/main/assets/vosk-es
          python3 -m venv .audio-test
          .audio-test/bin/pip install vosk==0.3.45
          .audio-test/bin/python spanish/test_spanish_audio.py vosk-model-small-es-0.42 spanish/fixtures | tee spanish-audio-test.txt

      - name: Run unit tests
        shell: bash
        run: |
          cd GPTWake
          ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: |
          cd GPTWake
          ./gradlew :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Sebastian-Wake-v0.2.apk
          cd ..
          sha256sum Sebastian-Wake-v0.2.apk | tee Sebastian-Wake-v0.2.sha256

      - name: Validate APK integrity, signature and ARM64 compatibility
        shell: bash
        run: |
          set -euo pipefail
          apk=Sebastian-Wake-v0.2.apk
          bt="$ANDROID_HOME/build-tools/37.0.0"
          test -s "$apk"
          unzip -t "$apk" > apk-integrity.txt
          "$bt/apksigner" verify --verbose --print-certs "$apk" | tee apk-signature.txt
          "$bt/aapt2" dump badging "$apk" | tee apk-badging.txt
          "$bt/zipalign" -c -P 16 -v 4 "$apk" | tee apk-alignment.txt
          grep -q "package: name='com.desmond.gptwake.sebastian' versionCode='101' versionName='1.1.0-sebastian-0.2'" apk-badging.txt
          grep -q "minSdkVersion:'32'" apk-badging.txt
          grep -q "native-code: 'arm64-v8a'" apk-badging.txt
          sha256sum -c Sebastian-Wake-v0.2.sha256
          echo "$GITHUB_SHA" > build-commit.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sebastian-Wake-v0.2
          path: |
            Sebastian-Wake-v0.2.apk
            Sebastian-Wake-v0.2.sha256
            apk-*.txt
            build-commit.txt
            spanish-audio-test.txt
          if-no-files-found: error

      - name: Publish verified debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="sebastian-v0.2-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title 'Sebastián Wake v0.2 (debug)' \
            --notes 'APK debug firmada. Versión 1.1.0-sebastian-0.2 (101), ARM64, Android API 32 o superior. Integridad, firma y alineación verificadas; pruebas unitarias superadas. Detector local en español con Vosk. Pruebas de audio sintético positivas y negativas superadas. Pendiente de prueba con la voz del usuario. La firma debug cambia respecto a v0.1: desinstalar la versión anterior antes de instalar esta.' \
            Sebastian-Wake-v0.2.apk Sebastian-Wake-v0.2.sha256 apk-*.txt build-commit.txt spanish-audio-test.txt
